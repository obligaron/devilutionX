name: Xbox One / Series

on:
  push:
    branches:
      - master
      - ccachekey
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    types: [opened, synchronize]
    paths-ignore:
      - '*.md'
      - 'docs/**'
  release:
    types: [published]
    paths-ignore:
      - '*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: ${{ github.workflow }}

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3
      with:
        msbuild-architecture: x64

    - name: Configure git
      shell: cmd
      run: |
        git config --global core.filemode false
        git config --global core.autocrlf false

    - name: Install gettext
      run: >
        New-Item -Path . -Name tools-gettext -ItemType Directory -Force &&
        Invoke-WebRequest -Uri "https://github.com/vslavik/gettext-tools-windows/releases/download/v0.22.5/gettext-tools-windows-0.22.5.zip" -OutFile tools-gettext.zip -Resume &&
        Expand-Archive tools-gettext.zip &&
        Remove-Item tools-gettext.zip &&
        Add-Content $env:GITHUB_PATH "$((Get-Item tools-gettext).FullName)\bin"

    - name: Build
      shell: powershell
      run: |
        # 1. Erstelle das Verzeichnis für den Wrapper
        New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\ccache-bin"
        
        # 2. Ermittle den echten ccache-Pfad über PowerShell (zuverlässiger als 'where' in CMD)
        $ccachePath = (Get-Command ccache.exe -ErrorAction Stop).Source
        Write-Host "ccache gefunden unter: $ccachePath"
        
        # 3. Kopiere die ccache.exe als cl.exe in unseren Wrapper-Ordner
        Copy-Item -Path $ccachePath -Destination "${{ github.workspace }}\ccache-bin\cl.exe" -Force
        
        # 4. Starte die build.bat mit den korrekten MSBuild-Injektionen über CMD-Kontext
        cd "${{ github.workspace }}\Packaging\xbox-one"
        cmd.exe /c "build.bat /p:CLToolPath=`"${{ github.workspace }}\ccache-bin`" /p:CLToolExe=cl.exe /p:TrackCommandLine=false"

    - name: Copy artifacts to package directory
      run: >
        New-Item -Path build\uwp-project -Name pkg -ItemType Directory -Force &&
        Get-Childitem -Path build\uwp-project\AppxPackages, build\uwp-project\Release
        -Include Microsoft.VCLibs.x64.*.appx, devilutionX_*_x64.appx -File -Recurse |
        Copy-Item -Destination build\uwp-project\pkg\

    - name: Upload-Package
      if: ${{ !env.ACT }}
      uses: actions/upload-artifact@v7
      with:
        name: devilutionx-xbox-one-series
        if-no-files-found: error
        path: |
          build/uwp-project/pkg/

    - name: Package Release
      if: ${{ github.event_name == 'release' && !env.ACT }}
      working-directory: ${{github.workspace}}/build/uwp-project/pkg/
      run: 7z a -r ../../../devilutionx-xbox-one-series.zip .

    - name: Update Release
      if: ${{ github.event_name == 'release' && !env.ACT }}
      uses: svenstaro/upload-release-action@v2
      with:
        file: devilutionx-xbox-one-series.zip
        overwrite: true
